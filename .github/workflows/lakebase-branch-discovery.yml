name: Lakebase Branch → Foglight Discovery

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *"

# Opt into Node 24 now so you don't see the Node 20 deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # (Optional) ensure jq exists; some runners have it, some don't.
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # Quick control‑plane sanity check so we know token/host are good.
      - name: Verify Lakebase API auth (sanity check)
        run: |
          set -e
          echo "Host: $DATABRICKS_HOST"
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/postgres/projects")
          echo "HTTP $code"
          cat /tmp/out.json || true
          test "$code" = "200"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # TEMP: Show requirements.txt so we can confirm there are no stray characters.
      # Remove this step once the pipeline runs cleanly.
      - name: Show requirements.txt (debug)
        working-directory: tools/lakebase-branch-discovery
        run: |
          echo "----- nl -ba -----"
          nl -ba requirements.txt || true
          echo "----- sed -n 'l' -----"
          sed -n 'l' requirements.txt || true

      - name: Install Python deps
        working-directory: tools/lakebase-branch-discovery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Resilience: even if requirements.txt ever gets a bad line again,
      # we still install the two packages we need to proceed.
      - name: Fallback install (in case requirements.txt has issues)
        working-directory: tools/lakebase-branch-discovery
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Render config from secrets (dry run)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PROJECT_FILTER: ${{ secrets.PROJECT_FILTER }}
        working-directory: tools/lakebase-branch-discovery
        run: |
          python - <<'PY'
          import os, yaml, json
          cfg_path = 'config.yaml'
          with open(cfg_path, 'r', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)

          host  = os.environ.get('DATABRICKS_HOST','').rstrip('/')
          token = os.environ.get('DATABRICKS_TOKEN','')
          flt   = os.environ.get('PROJECT_FILTER','')

          if host:
              cfg['workspace_url'] = host
          if token:
              cfg['access_token'] = token
          if flt:
              cfg['project_id_filter'] = [s.strip() for s in flt.split(',') if s.strip()]

          with open(cfg_path, 'w', encoding='utf-8') as f:
              yaml.dump(cfg, f, sort_keys=False)

          print("Effective config:", json.dumps(cfg, indent=2))
          PY

          python branch_to_foglight.py --dry-run

      - name: Run discovery (write artifacts)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        working-directory: tools/lakebase-branch-discovery
        run: |
          python branch_to_foglight.py

      - name: Upload artifacts (CSV + SQL)
        uses: actions/upload-artifact@v6
        with:
          name: foglight-onboarding-artifacts
          path: tools/lakebase-branch-discovery/output/*
          if-no-files-found: error
